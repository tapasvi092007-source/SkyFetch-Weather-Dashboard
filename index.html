<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkyFetch - Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🌤️ SkyFetch</h1>
    <p class="tagline">Your Personal Weather Dashboard</p>

    <div class="search-bar">
      <input type="text" id="city-input" placeholder="Enter city name" />
      <button id="search-btn">Fetch Weather</button>
    </div>

    <!-- Recent searches -->
    <div id="recent-searches" class="recent-searches"></div>

    <!-- Current weather -->
    <div id="weather-display" aria-live="polite">
      <p class="loading">Loading weather data...</p>
    </div>

    <!-- Forecast -->
    <div id="forecast-display" class="forecast-grid"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
